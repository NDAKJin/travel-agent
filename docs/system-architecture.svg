<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">行迹 AI 旅行助手系统架构</title>
  <desc id="desc">用户请求主链路与 RAG 文档异步导入链路</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172642" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8291a6"/></marker>
    <style>
      text { dominant-baseline: middle; }
      .title { font: 700 24px "Microsoft YaHei", sans-serif; fill: #1d2b4b; }
      .layer { font: 700 20px "Microsoft YaHei", sans-serif; fill: #1d2b4b; }
      .hint { font: 500 13px "Microsoft YaHei", sans-serif; fill: #71809b; }
      .label { font: 600 16px "Microsoft YaHei", sans-serif; fill: #253657; }
      .small { font: 500 13px "Microsoft YaHei", sans-serif; fill: #52627e; }
      .card { fill: #fff; stroke: #e0e6f1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .module { fill: #f8faff; stroke: #d5deef; stroke-width: 1.5; rx: 12; }
      .flow { fill: none; stroke: #8291a6; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f3f6fb"/>
  <text x="800" y="34" text-anchor="middle" class="title">行迹 AI 旅行助手系统架构</text>
  <g transform="translate(48 64)"><rect width="1504" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#5e78df"/><text x="38" y="43" class="layer">用户入口</text><text x="38" y="72" class="hint">用户服务与运营管理</text><rect x="430" y="25" width="270" height="62" class="module"/><text x="565" y="56" text-anchor="middle" class="label">agent-web · 用户 Web</text><rect x="735" y="25" width="270" height="62" class="module"/><text x="870" y="56" text-anchor="middle" class="label">微信小程序</text><rect x="1040" y="25" width="270" height="62" class="module"/><text x="1175" y="56" text-anchor="middle" class="label">web · 管理台</text></g>
  <g transform="translate(48 204)"><rect width="1504" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#48a6d4"/><text x="38" y="43" class="layer">接口与应用层</text><text x="38" y="72" class="hint">Spring Boot API、鉴权、会话与管理接口</text><rect x="560" y="25" width="520" height="62" class="module"/><text x="820" y="56" text-anchor="middle" class="label">Travel Agent API · Spring Boot</text></g>
  <g transform="translate(48 344)"><rect width="1504" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#43b88b"/><text x="38" y="43" class="layer">智能体编排层</text><text x="38" y="72" class="hint">LangGraph4j 状态驱动工作流</text><rect x="405" y="25" width="260" height="62" class="module"/><text x="535" y="56" text-anchor="middle" class="label">总控 Agent</text><rect x="695" y="25" width="300" height="62" class="module"/><text x="845" y="56" text-anchor="middle" class="label">需求确认与最终答复</text><rect x="1025" y="25" width="300" height="62" class="module"/><text x="1175" y="56" text-anchor="middle" class="label">路线规划子图</text></g>
  <g transform="translate(48 484)"><rect width="1504" height="132" class="card"/><rect width="9" height="132" rx="4" fill="#9a7ddd"/><text x="38" y="43" class="layer">模型与知识服务层</text><text x="38" y="72" class="hint">模型调用、知识检索与文档处理</text><rect x="350" y="35" width="220" height="62" class="module"/><text x="460" y="66" text-anchor="middle" class="label">DashScope 模型</text><rect x="610" y="35" width="220" height="62" class="module"/><text x="720" y="66" text-anchor="middle" class="label">旅行 / 路线 / 预算专家</text><rect x="870" y="35" width="220" height="62" class="module"/><text x="980" y="66" text-anchor="middle" class="label">Qdrant 混合检索</text><rect x="1130" y="35" width="220" height="62" class="module"/><text x="1240" y="66" text-anchor="middle" class="label">Qwen Rerank</text></g>
  <g transform="translate(48 644)"><rect width="1504" height="132" class="card"/><rect width="9" height="132" rx="4" fill="#8291a6"/><text x="38" y="43" class="layer">数据与基础设施层</text><text x="38" y="72" class="hint">持久化、缓存、消息与异步任务</text><rect x="300" y="35" width="210" height="62" class="module"/><text x="405" y="66" text-anchor="middle" class="label">MySQL</text><text x="405" y="86" text-anchor="middle" class="small">会话 / 任务 / Outbox</text><rect x="545" y="35" width="210" height="62" class="module"/><text x="650" y="66" text-anchor="middle" class="label">Redis</text><text x="650" y="86" text-anchor="middle" class="small">Checkpoint / 缓存 / 锁</text><rect x="790" y="35" width="210" height="62" class="module"/><text x="895" y="66" text-anchor="middle" class="label">Kafka</text><text x="895" y="86" text-anchor="middle" class="small">任务与事件流</text><rect x="1035" y="35" width="210" height="62" class="module"/><text x="1140" y="66" text-anchor="middle" class="label">Canal</text><text x="1140" y="86" text-anchor="middle" class="small">MySQL 变更投递</text></g>
  <path d="M800 176 V204" class="flow"/><path d="M800 316 V344" class="flow"/><path d="M800 456 V484" class="flow"/><path d="M800 616 V644" class="flow"/>
  <g transform="translate(48 812)"><rect width="1504" height="124" class="card"/><rect width="9" height="124" rx="4" fill="#e39b4a"/><text x="38" y="36" class="layer">RAG 文档异步导入链路</text><text x="38" y="64" class="hint">上传与解析解耦，任务通过 Kafka 异步处理</text><rect x="500" y="22" width="180" height="62" class="module"/><text x="590" y="53" text-anchor="middle" class="label">文档上传 API</text><rect x="720" y="22" width="180" height="62" class="module"/><text x="810" y="53" text-anchor="middle" class="label">Kafka / Canal</text><rect x="940" y="22" width="180" height="62" class="module"/><text x="1030" y="53" text-anchor="middle" class="label">Tika + 分块</text><rect x="1160" y="22" width="180" height="62" class="module"/><text x="1250" y="53" text-anchor="middle" class="label">Embedding → Qdrant</text><path d="M680 53 H720" class="flow"/><path d="M900 53 H940" class="flow"/><path d="M1120 53 H1160" class="flow"/></g>
  <path d="M980 546 C1070 575 1070 610 980 675" class="flow dashed"/><path d="M650 546 C560 575 560 610 650 675" class="flow dashed"/><text x="1085" y="600" class="small">RAG 查询 / 结果缓存</text><text x="430" y="600" class="small">Checkpoint / 会话状态</text>
</svg>
