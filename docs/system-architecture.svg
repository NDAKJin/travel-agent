<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">行迹 AI 旅行助手系统架构</title>
  <desc id="desc">从前端层到基础设施层的分层架构图</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172642" flood-opacity=".13"/></filter>
    <style>
      text { dominant-baseline: middle; }
      .layer { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1d2b4b; }
      .hint { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #71809b; }
      .label { font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #253657; }
      .card { fill: #fff; stroke: #e0e6f1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .module { fill: #f8faff; stroke: #d5deef; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#f3f6fb"/>

  <g transform="translate(48 40)">
    <rect width="1344" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#5e78df"/>
    <text x="38" y="44" class="layer">前端层</text><text x="38" y="72" class="hint">用户入口与运营交互</text>
    <rect x="490" y="26" width="270" height="60" class="module"/><text x="625" y="56" text-anchor="middle" class="label">微信小程序</text>
    <rect x="820" y="26" width="270" height="60" class="module"/><text x="955" y="56" text-anchor="middle" class="label">运营管理台</text>
  </g>

  <g transform="translate(48 180)">
    <rect width="1344" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#48a6d4"/>
    <text x="38" y="44" class="layer">接口层</text><text x="38" y="72" class="hint">统一请求入口与会话接入</text>
    <rect x="530" y="26" width="540" height="60" class="module"/><text x="800" y="56" text-anchor="middle" class="label">Travel Agent API · Spring Boot</text>
  </g>

  <g transform="translate(48 320)">
    <rect width="1344" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#43b88b"/>
    <text x="38" y="44" class="layer">智能体编排层</text><text x="38" y="72" class="hint">LangGraph4j 状态驱动工作流</text>
    <rect x="490" y="26" width="270" height="60" class="module"/><text x="625" y="56" text-anchor="middle" class="label">总控 Agent</text>
    <rect x="820" y="26" width="270" height="60" class="module"/><text x="955" y="56" text-anchor="middle" class="label">路线规划子图</text>
  </g>

  <g transform="translate(48 460)">
    <rect width="1344" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#9a7ddd"/>
    <text x="38" y="44" class="layer">AI 与 RAG 层</text><text x="38" y="72" class="hint">模型调用、知识检索与文档处理</text>
    <rect x="410" y="26" width="215" height="60" class="module"/><text x="517" y="56" text-anchor="middle" class="label">DashScope</text>
    <rect x="650" y="26" width="215" height="60" class="module"/><text x="757" y="56" text-anchor="middle" class="label">Qdrant</text>
    <rect x="890" y="26" width="215" height="60" class="module"/><text x="997" y="56" text-anchor="middle" class="label">Qwen Rerank</text>
    <rect x="1130" y="26" width="190" height="60" class="module"/><text x="1225" y="56" text-anchor="middle" class="label">Apache Tika</text>
  </g>

  <g transform="translate(48 600)">
    <rect width="1344" height="112" class="card"/><rect width="9" height="112" rx="4" fill="#8291a6"/>
    <text x="38" y="44" class="layer">基础设施层</text><text x="38" y="72" class="hint">持久化、缓存与消息服务</text>
    <rect x="550" y="26" width="215" height="60" class="module"/><text x="657" y="56" text-anchor="middle" class="label">MySQL</text>
    <rect x="790" y="26" width="215" height="60" class="module"/><text x="897" y="56" text-anchor="middle" class="label">Redis</text>
    <rect x="1030" y="26" width="215" height="60" class="module"/><text x="1137" y="56" text-anchor="middle" class="label">Kafka</text>
  </g>

  <g stroke="#aeb9ce" stroke-width="2.5" stroke-linecap="round"><path d="M720 145 V180"/><path d="M720 285 V320"/><path d="M720 425 V460"/><path d="M720 565 V600"/></g>
  <g fill="#aeb9ce"><circle cx="720" cy="162" r="4"/><circle cx="720" cy="302" r="4"/><circle cx="720" cy="442" r="4"/><circle cx="720" cy="582" r="4"/></g>
</svg>
