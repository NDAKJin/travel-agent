services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travelagent}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=20
      - --performance-schema=OFF
      - --table-open-cache=200
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      target: api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-travelagent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_AI_DASHSCOPE_API_KEY: ${SPRING_AI_DASHSCOPE_API_KEY}
      SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL}
      SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MULTI_MODEL: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MULTI_MODEL:-true}
      SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_MODEL: ${SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_MODEL:-text-embedding-v4}
      SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_DIMENSIONS: ${SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_DIMENSIONS:-1024}
      TRAVEL_AGENT_AUTH_JWT_SECRET: ${TRAVEL_AGENT_AUTH_JWT_SECRET:?Set TRAVEL_AGENT_AUTH_JWT_SECRET in .env}
      TRAVEL_AGENT_AUTH_WX_APP_ID: ${TRAVEL_AGENT_AUTH_WX_APP_ID}
      TRAVEL_AGENT_AUTH_WX_SECRET: ${TRAVEL_AGENT_AUTH_WX_SECRET}
      TRAVEL_AGENT_AMAP_WEB_SERVICE_KEY: ${TRAVEL_AGENT_AMAP_WEB_SERVICE_KEY}
      TRAVEL_AGENT_AGENT_ELASTICSEARCH_HOST: ${TRAVEL_AGENT_AGENT_ELASTICSEARCH_HOST:?Set TRAVEL_AGENT_AGENT_ELASTICSEARCH_HOST in .env}
      TRAVEL_AGENT_AGENT_ELASTICSEARCH_PORT: ${TRAVEL_AGENT_AGENT_ELASTICSEARCH_PORT:-9200}
      SPRING_NEO4J_URI: ${SPRING_NEO4J_URI:-bolt://localhost:7687}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-}
      TRAVEL_AGENT_NEO4J_ENABLED: ${TRAVEL_AGENT_NEO4J_ENABLED:-false}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 256m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  web:
    build:
      context: .
      target: web
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY}
        VITE_AMAP_SECURITY_JS_CODE: ${VITE_AMAP_SECURITY_JS_CODE}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  mysql-data:
