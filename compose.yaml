services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travelagent}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=20
      - --performance-schema=OFF
      - --table-open-cache=200
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:6333/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnami/kafka:3.9
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-29092}"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    build:
      context: .
      target: api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-travelagent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME:-}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_AI_DASHSCOPE_API_KEY: ${SPRING_AI_DASHSCOPE_API_KEY:?Set SPRING_AI_DASHSCOPE_API_KEY in .env}
      SPRING_AI_VECTORSTORE_QDRANT_HOST: ${SPRING_AI_VECTORSTORE_QDRANT_HOST:-qdrant}
      SPRING_AI_VECTORSTORE_QDRANT_PORT: ${SPRING_AI_VECTORSTORE_QDRANT_PORT:-6334}
      SPRING_AI_VECTORSTORE_QDRANT_API_KEY: ${SPRING_AI_VECTORSTORE_QDRANT_API_KEY:-}
      SPRING_AI_VECTORSTORE_QDRANT_COLLECTION_NAME: ${SPRING_AI_VECTORSTORE_QDRANT_COLLECTION_NAME:-travel_knowledge}
      SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_MODEL: ${SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_MODEL:-text-embedding-v4}
      SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL:-qwen3.8-max}
      SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MULTI_MODEL: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MULTI_MODEL:-true}
      TRAVEL_AGENT_RAG_INGESTION_STORAGE_DIR: /tmp/travel-agent-rag
      TRAVEL_AGENT_AUTH_JWT_SECRET: ${TRAVEL_AGENT_AUTH_JWT_SECRET:?Set TRAVEL_AGENT_AUTH_JWT_SECRET in .env}
      TRAVEL_AGENT_AUTH_WX_APP_ID: ${TRAVEL_AGENT_AUTH_WX_APP_ID}
      TRAVEL_AGENT_AUTH_WX_SECRET: ${TRAVEL_AGENT_AUTH_WX_SECRET}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 256m
    volumes:
      - rag-ingestion-data:/tmp/travel-agent-rag
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  mysql-data:
  qdrant-data:
  rag-ingestion-data:
  kafka-data:
