# Copy this file to application.yml for local development.
# Do not commit application.yml or put real credentials in this example file.

spring:
  application:
    name: travel-agent
  ai:
    model:
      embedding:
        text: dashscope
    vectorstore:
      qdrant:
        host: ${SPRING_AI_VECTORSTORE_QDRANT_HOST:localhost}
        port: ${SPRING_AI_VECTORSTORE_QDRANT_PORT:6333}
        api-key: ${SPRING_AI_VECTORSTORE_QDRANT_API_KEY:}
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: ${SPRING_AI_DASHSCOPE_EMBEDDING_OPTIONS_MODEL:text-embedding-v4}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL:qwen3.8-max}
          multi-model: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MULTI_MODEL:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelagent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:travelagent}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1700000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    listener:
      ack-mode: record
    consumer:
      properties:
        "[max.poll.interval.ms]": ${SPRING_KAFKA_MAX_POLL_INTERVAL_MS:1800000}
    producer:
      acks: all
      properties:
        "[enable.idempotence]": true

mybatis:
  mapper-locations: classpath*:com/travelagent/travelagent/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

nextdoc4j:
  enabled: ${NEXTDOC4J_ENABLED:true}
  auth:
    enabled: true
    password: 123456

travel-agent:
  external-http:
    connect-timeout: ${TRAVEL_AGENT_EXTERNAL_HTTP_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${TRAVEL_AGENT_EXTERNAL_HTTP_READ_TIMEOUT:PT15S}
  route-cache:
    ttl: ${TRAVEL_AGENT_ROUTE_CACHE_TTL:PT24H}
    similarity-threshold: ${TRAVEL_AGENT_ROUTE_CACHE_SIMILARITY_THRESHOLD:0.92}
  route-expert:
    core-pool-size: ${TRAVEL_AGENT_ROUTE_EXPERT_CORE_POOL_SIZE:8}
    max-pool-size: ${TRAVEL_AGENT_ROUTE_EXPERT_MAX_POOL_SIZE:16}
    queue-capacity: ${TRAVEL_AGENT_ROUTE_EXPERT_QUEUE_CAPACITY:32}
    keep-alive-seconds: ${TRAVEL_AGENT_ROUTE_EXPERT_KEEP_ALIVE_SECONDS:60}
    allow-core-thread-timeout: ${TRAVEL_AGENT_ROUTE_EXPERT_ALLOW_CORE_THREAD_TIMEOUT:false}
    thread-name-prefix: ${TRAVEL_AGENT_ROUTE_EXPERT_THREAD_NAME_PREFIX:route-expert-}
    wait-for-tasks-to-complete-on-shutdown: ${TRAVEL_AGENT_ROUTE_EXPERT_WAIT_FOR_TASKS:true}
    await-termination-seconds: ${TRAVEL_AGENT_ROUTE_EXPERT_AWAIT_TERMINATION_SECONDS:30}
    rejection-policy: ${TRAVEL_AGENT_ROUTE_EXPERT_REJECTION_POLICY:caller-runs}
  rag:
    collection-name: ${TRAVEL_AGENT_RAG_COLLECTION_NAME:travel_knowledge_hybrid}
    hybrid:
      enabled: ${TRAVEL_AGENT_RAG_HYBRID_ENABLED:true}
      dense-weight: ${TRAVEL_AGENT_RAG_DENSE_WEIGHT:0.7}
      sparse-weight: ${TRAVEL_AGENT_RAG_SPARSE_WEIGHT:0.3}
    cache:
      ttl: ${TRAVEL_AGENT_RAG_CACHE_TTL:PT10M}
      version: ${TRAVEL_AGENT_RAG_CACHE_VERSION:v1}
    vector-topic: ${TRAVEL_AGENT_RAG_VECTOR_TOPIC:rag-vector-sync}
    vector-consumer-group: ${TRAVEL_AGENT_RAG_VECTOR_CONSUMER_GROUP:travel-agent-rag-vector-sync}
    canal:
      enabled: ${TRAVEL_AGENT_RAG_CANAL_ENABLED:false}
      host: ${TRAVEL_AGENT_RAG_CANAL_HOST:localhost}
      port: ${TRAVEL_AGENT_RAG_CANAL_PORT:11111}
      destination: ${TRAVEL_AGENT_RAG_CANAL_DESTINATION:example}
      username: ${TRAVEL_AGENT_RAG_CANAL_USERNAME:}
      password: ${TRAVEL_AGENT_RAG_CANAL_PASSWORD:}
      filter: ${TRAVEL_AGENT_RAG_CANAL_FILTER:travelagent.rag_vector_outbox}
      ingestion-filter: ${TRAVEL_AGENT_RAG_CANAL_INGESTION_FILTER:travelagent.rag_ingestion_outbox}
      poll-interval-ms: ${TRAVEL_AGENT_RAG_CANAL_POLL_INTERVAL_MS:1000}
    top-k: ${TRAVEL_AGENT_RAG_TOP_K:5}
    recall-top-k: ${TRAVEL_AGENT_RAG_RECALL_TOP_K:20}
    similarity-threshold: ${TRAVEL_AGENT_RAG_SIMILARITY_THRESHOLD:0.65}
    ingestion-topic: ${TRAVEL_AGENT_RAG_INGESTION_TOPIC:rag-ingestion}
    ingestion-consumer-group: ${TRAVEL_AGENT_RAG_INGESTION_CONSUMER_GROUP:travel-agent-rag-ingestion}
    ingestion-storage-dir: ${TRAVEL_AGENT_RAG_INGESTION_STORAGE_DIR:${java.io.tmpdir}/travel-agent-rag}
    rerank:
      endpoint: ${TRAVEL_AGENT_RAG_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank}
      model: ${TRAVEL_AGENT_RAG_RERANK_MODEL:qwen3-rerank}
      top-n: ${TRAVEL_AGENT_RAG_RERANK_TOP_N:5}
  studio:
    enabled: ${TRAVEL_AGENT_STUDIO_ENABLED:false}
  auth:
    issuer: ${TRAVEL_AGENT_AUTH_ISSUER:travel-agent}
    jwt-secret: ${TRAVEL_AGENT_AUTH_JWT_SECRET:}
    access-token-ttl: ${TRAVEL_AGENT_AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${TRAVEL_AGENT_AUTH_REFRESH_TOKEN_TTL:P1D}
    bootstrap-admin:
      username: ${TRAVEL_AGENT_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${TRAVEL_AGENT_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${TRAVEL_AGENT_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:ops-admin}
    wx:
      app-id: ${TRAVEL_AGENT_AUTH_WX_APP_ID:}
      secret: ${TRAVEL_AGENT_AUTH_WX_SECRET:}
      code2-session-url: ${TRAVEL_AGENT_AUTH_WX_CODE2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  agent:
    max-message-chars: ${TRAVEL_AGENT_AGENT_MAX_MESSAGE_CHARS:4000}
    max-session-id-chars: ${TRAVEL_AGENT_AGENT_MAX_SESSION_ID_CHARS:64}
    max-history-messages: ${TRAVEL_AGENT_AGENT_MAX_HISTORY_MESSAGES:40}
    profile:
      name: ${TRAVEL_AGENT_AGENT_PROFILE_NAME:Travel Buddy}
  observability:
    kafka-topic: ${TRAVEL_AGENT_OBSERVABILITY_KAFKA_TOPIC:agent-observation}
    consumer-group: ${TRAVEL_AGENT_OBSERVABILITY_CONSUMER_GROUP:travel-agent-observation-writer}
